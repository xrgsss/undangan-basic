    />

    <style>
      /* Splash awal: mencegah layar putih kosong sebelum JS siap. */
      html { background-color: #f7f5ef; }
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: radial-gradient(120% 100% at 50% 0%, #fffdf8 0%, #f7f5ef 55%, #eee8da 100%);
        font-family: Georgia, 'Times New Roman', serif;
        color: #b9955b;
        letter-spacing: 0.28em;
        font-size: 11px;
        text-transform: uppercase;
        z-index: 9999;
      }
      #splash .ring {
        width: 54px;
        height: 54px;
        border-radius: 999px;
        border: 1px solid rgba(185, 149, 91, 0.45);
        border-top-color: #b9955b;
        animation: splashspin 1.1s linear infinite;
      }
      @keyframes splashspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #splash .ring { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash" aria-hidden="true">
        <div class="ring"></div>
        <span>Memuat undangan</span>
      </div>
    </div>
    <noscript>

  </body>
